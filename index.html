<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Basic Website</title>
  <meta name="description" content="A short description of your page goes here.">
  <!-- Your styles -->
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Keyboard users need to see where focus is */
    :focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }
    /* Respect users who prefer less motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <h1 class="title">Basic Website</h1>
    </header>

    <nav class="sidebar" aria-label="Primary">
      <ul class="nav-list">
        <li>#Home</a></li>
        <li>#Section A</a></li>
        <li>#Section B</a></li>
        <li>#Contact</a></li>
      </ul>
    </nav>

    <main id="main-content" class="content">
      <!-- Two content areas/columns -->
      <section class="column column-left" aria-labelledby="col-left-h">
        <h2 id="col-left-h" class="visually-hidden">Left content</h2>

        <article class="card">
          <h3>Intro Block</h3>
          <p>Your content goes here.</p>
          <button class="main-button" id="myButton" type="button">Button</button>
        </article>

        <article class="card">
          <h3>Lower Left Block</h3>
          <!-- Greeting goes here -->
          <p id="location-greeting" role="status" aria-live="polite">
            Detecting where you’re visiting from…
          </p>
          <noscript>
            Enable JavaScript to see a personalized greeting.
          </noscript>
        </article>
      </section>

      <section class="column column-right" aria-labelledby="col-right-h">
        <h2 id="col-right-h" class="visually-hidden">Right content</h2>
        <article class="card">
          <h3>Right Column Block</h3>
          <p>Content in the right column.</p>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <small>© <span id="year"></span> Phoebe Zeller</small>
    </footer>
  </div>

  <!-- Keep the copyright year current -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <!-- Your scripts -->
  <script src="script.js" defer></script>
</body>
</html>
